stages:
  - checkout
  - test
  - build
  - docker

variables:
  IMAGE_NAME: "$DOCKER_HUB_USER/my-web-app"
  TEST_CONTAINER: "gitlab_test_web"

checkout_job:
  stage: checkout
  script:
    - echo "Перевіряю наявність файлів сайту..."
    - ls -la
    - test -d html || (echo "Помилка: папка html відсутня!" && exit 1)
    - echo "Папку з сайтом знайдено."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

test_job:
  stage: test
  script:
    - echo "Перевіряю конфігураційні файли Docker..."
    - test -f Dockerfile || (echo "Помилка: Dockerfile не знайдено!" && exit 1)
    - test -f docker-compose.yml || (echo "Помилка: docker-compose.yml не знайдено!" && exit 1)
    - echo "Всі файли конфігурації на місці."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

build_job:
  stage: build
  script:
    - echo "Збираю Docker-образ для сайту..."
    - docker build -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -t ${IMAGE_NAME}:latest .
    - echo "Образ успішно зібрано."
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

docker_job:
  stage: docker
  script:
    - echo "Зупиняю та видаляю старі контейнери..."
    - docker-compose down -v --remove-orphans || true
    - docker stop ${TEST_CONTAINER} || true
    - docker rm ${TEST_CONTAINER} || true
    
    - echo "Тестую новий контейнер..."
    - docker run -d --name ${TEST_CONTAINER} -p 8085:80 ${IMAGE_NAME}:latest
    - sleep 3
    - curl -f http://localhost:8085 || (echo "Помилка: тестовий контейнер не відповідає!" && exit 1)
    - docker stop ${TEST_CONTAINER} && docker rm ${TEST_CONTAINER}
    
    - echo "Авторизуюсь та завантажую новий образ на Docker Hub..."
    - echo "$DOCKER_HUB_PASS" | docker login -u "$DOCKER_HUB_USER" --password-stdin
    - docker push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_NAME}:latest
    - docker logout

    - echo "Запускаю весь веб-сервер через Docker Compose..."
    - DOCKER_HUB_USER=${DOCKER_HUB_USER} docker-compose up -d --force-recreate
    - echo "Веб-сервер повністю піднято та готово до роботи!"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'