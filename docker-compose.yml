services:
  web:
    image: ${DOCKER_HUB_USER}/my-web-app:latest
    container_name: custom_web_server
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - web_network

  db:
    image: mysql:8.0
    container_name: mysql_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - web_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_panel
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - db
    networks:
      - web_network

networks:
  web_network:
    driver: bridge

volumes:
  db_data: